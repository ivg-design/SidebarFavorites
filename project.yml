name: SidebarFavorites
options:
  bundleIdPrefix: com.ivg-design
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: 7S422NVLUK
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  # Main Manager App
  SidebarFavoritesManager:
    type: application
    platform: macOS
    sources:
      - path: SidebarFavoritesManager
    settings:
      base:
        INFOPLIST_FILE: SidebarFavoritesManager/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.ivg-design.SidebarFavoritesManager
        PRODUCT_NAME: SidebarFavorites Manager
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        SWIFT_VERSION: "5.9"
        SWIFT_OBJC_BRIDGING_HEADER: SidebarFavoritesManager/SidebarFavoritesManager-Bridging-Header.h
        CLANG_ENABLE_MODULES: YES
    preBuildScripts:
      - name: Increment Build Number
        script: |
          PLIST_PATH="${SRCROOT}/${INFOPLIST_FILE}"
          if [ -f "$PLIST_PATH" ]; then
            BUILD_NUM=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST_PATH" 2>&1 | grep -E '^[0-9]+$' || echo "0")
            if [ -z "$BUILD_NUM" ]; then BUILD_NUM=0; fi
            NEW_BUILD_NUM=$((BUILD_NUM + 1))
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEW_BUILD_NUM" "$PLIST_PATH" 2>/dev/null
            echo "Build number: $NEW_BUILD_NUM"
          fi
        basedOnDependencyAnalysis: false

schemes:
  SidebarFavoritesManager:
    build:
      targets:
        SidebarFavoritesManager: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
