name: SidebarFavorites
options:
  bundleIdPrefix: com.ivg-design
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: 7S422NVLUK
    CODE_SIGN_STYLE: Automatic
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  # Main Manager App
  SidebarFavoritesManager:
    type: application
    platform: macOS
    sources:
      - path: SidebarFavoritesManager
        excludes:
          - "Resources/IconAppTemplate.app"
    settings:
      base:
        INFOPLIST_FILE: SidebarFavoritesManager/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.ivg-design.SidebarFavoritesManager
        PRODUCT_NAME: SidebarFavorites Manager
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        SWIFT_VERSION: "5.9"
    preBuildScripts:
      - name: Increment Build Number
        script: |
          PLIST_PATH="${SRCROOT}/${INFOPLIST_FILE}"
          if [ -f "$PLIST_PATH" ]; then
            BUILD_NUM=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST_PATH" 2>&1 | grep -E '^[0-9]+$' || echo "0")
            if [ -z "$BUILD_NUM" ]; then BUILD_NUM=0; fi
            NEW_BUILD_NUM=$((BUILD_NUM + 1))
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEW_BUILD_NUM" "$PLIST_PATH" 2>/dev/null
            echo "Build number: $NEW_BUILD_NUM"
          fi
        basedOnDependencyAnalysis: false
    dependencies:
      - target: IconAppTemplate
        copy:
          destination: resources
          subpath: ""

  # Icon App Template (becomes IconAppTemplate.app)
  IconAppTemplate:
    type: application
    platform: macOS
    sources:
      - path: IconAppTemplate/IconApp
    settings:
      base:
        INFOPLIST_FILE: IconAppTemplate/IconApp/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.ivg-design.SidebarFavorites.IconAppTemplate
        PRODUCT_NAME: IconAppTemplate
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        SWIFT_VERSION: "5.9"
        SKIP_INSTALL: YES
    dependencies:
      - target: IconAppTemplateSync
        embed: true
        codeSign: true

  # Finder Sync Extension for IconAppTemplate
  IconAppTemplateSync:
    type: app-extension
    platform: macOS
    sources:
      - path: IconAppTemplate/FinderSync
        excludes:
          - "URLs"
      - path: IconAppTemplate/FinderSync/URLs
        type: file
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: IconAppTemplate/FinderSync/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.ivg-design.SidebarFavorites.IconAppTemplate.Sync
        PRODUCT_NAME: IconAppSync
        PRODUCT_MODULE_NAME: IconAppSync
        CODE_SIGN_ENTITLEMENTS: IconAppTemplate/FinderSync/FinderSync.entitlements
        SKIP_INSTALL: YES
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        SWIFT_VERSION: "5.9"

schemes:
  SidebarFavoritesManager:
    build:
      targets:
        SidebarFavoritesManager: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
