name: SidebarFavorites
options:
  bundleIdPrefix: com.ivg-design
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: 7S422NVLUK
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEAD_CODE_STRIPPING: YES
    # NO is load-bearing: the Increment Build Number script writes CFBundleVersion
    # back into the source Info.plist, and the script sandbox blocks writes to
    # SRCROOT - with sandboxing on, every build silently stays at the same number.
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  # Main Manager App
  SidebarFavoritesManager:
    type: application
    platform: macOS
    sources:
      - path: SidebarFavoritesManager
        excludes:
          # Sources for the generated Finder Sync helper - a separate program,
          # compiled by the Build FinderSync Template phase below, never linked
          # into the Manager itself.
          - "FinderSyncTemplate/**"
    settings:
      base:
        INFOPLIST_FILE: SidebarFavoritesManager/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.ivg-design.SidebarFavoritesManager
        PRODUCT_NAME: SidebarFavorites Manager
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        SWIFT_VERSION: "5.9"
        SWIFT_OBJC_BRIDGING_HEADER: SidebarFavoritesManager/SidebarFavoritesManager-Bridging-Header.h
        CLANG_ENABLE_MODULES: YES
    postBuildScripts:
      # Advanced ("both icons") mode clones these two binaries per favorite.
      # They are BUILT here rather than committed: they are products, and the
      # sources beside them are the thing worth reviewing. The appex entry point
      # must be _NSExtensionMain and the module name must stay SBFAdvSync -
      # FinderSyncAppGenerator writes "SBFAdvSync.FinderSyncExt" into every
      # generated appex's Info.plist.
      - name: Build FinderSync Template
        script: |
          SRC="${SRCROOT}/SidebarFavoritesManager/FinderSyncTemplate"
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/FinderSyncTemplate"
          mkdir -p "$DEST"
          xcrun swiftc -O -module-name SBFAdvHost \
            -o "$DEST/host-bin" "$SRC/HostMain.swift" || exit 1
          xcrun swiftc -O -module-name SBFAdvSync \
            -framework FinderSync -framework Cocoa \
            -Xlinker -e -Xlinker _NSExtensionMain \
            -o "$DEST/appex-bin" "$SRC/FinderSyncExt.swift" || exit 1
        basedOnDependencyAnalysis: false
    preBuildScripts:
      - name: Increment Build Number
        script: |
          PLIST_PATH="${SRCROOT}/${INFOPLIST_FILE}"
          if [ -f "$PLIST_PATH" ]; then
            BUILD_NUM=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST_PATH" 2>&1 | grep -E '^[0-9]+$' || echo "0")
            if [ -z "$BUILD_NUM" ]; then BUILD_NUM=0; fi
            NEW_BUILD_NUM=$((BUILD_NUM + 1))
            if /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEW_BUILD_NUM" "$PLIST_PATH"; then
              echo "Build number: $NEW_BUILD_NUM"
            else
              echo "warning: Increment Build Number could not write $PLIST_PATH (still at $BUILD_NUM)" >&2
            fi
          fi
        basedOnDependencyAnalysis: false

schemes:
  SidebarFavoritesManager:
    build:
      targets:
        SidebarFavoritesManager: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
# (appended by dual-mode demo build) copy the Finder Sync template binaries —
# XcodeGen does not pick up extension-less executables as resources.
