<style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden;background:#FBF7F0;color:#1E1B16;font-family:'Public Sans',sans-serif}
.wrap{position:relative;width:1200px;height:630px;padding:72px 80px}
.icon{width:104px;height:104px;border-radius:24px;box-shadow:0 10px 30px rgba(30,27,22,.18)}

.line{position:absolute;left:80px;bottom:64px;font-size:24px;color:#6E675C}

.side{position:absolute;right:80px;top:84px;width:300px;background:#EFEAE1;border:1px solid #E3DCD0;border-radius:18px;padding:22px 16px;box-shadow:0 24px 50px rgba(30,27,22,.12)}

.r{display:flex;align-items:center;gap:14px;height:46px;padding:0 12px;border-radius:10px;font-size:20px}
.r.sel{background:#D9D1C3}
.r svg{width:24px;height:24px;stroke:#E8542F;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.r .ph{width:22px;height:18px;border-radius:4px;background:#8FB7DD}
.div{height:1px;background:#D9D1C3;margin:12px 6px}
